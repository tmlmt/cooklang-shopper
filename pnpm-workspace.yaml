allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  '@prisma/engines': true
  better-sqlite3: true
  prisma: true
  nuxt-i18n-micro: true
permissions:
  '@nuxtjs/robots':
    skills: true
  '@nuxtjs/sitemap':
    skills: true
  nuxt-og-image:
    skills: true
  nuxt-seo-utils:
    skills: true
  nuxtseo-layer-devtools:
    skills: true
minimumReleaseAgeExclude:
  - '@tmlmt/cooklang-parser'
  - 'nuxt'
  - '@nuxt/kit@4.6.4'
  - '@nuxt/nitro-server@4.6.4'
  - '@nuxt/schema@4.6.4'
  - '@nuxt/vite-builder@4.6.4'
  - '@nuxt/vite-server@4.6.4'
  - nitropack@2.13.6
  - unrouting@0.3.2
