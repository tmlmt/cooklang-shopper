patchedDependencies:
  nuxt-auth-utils: patches/nuxt-auth-utils.patch
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  '@prisma/engines': true
  better-sqlite3: true
  prisma: true
  nuxt-i18n-micro: true
permissions:
  '@nuxtjs/robots':
    skills: true
  '@nuxtjs/sitemap':
    skills: true
  nuxt-og-image:
    skills: true
  nuxt-seo-utils:
    skills: true
  nuxtseo-layer-devtools:
    skills: true
minimumReleaseAgeExclude:
  - '@tmlmt/cooklang-parser@3.0.0-alpha.48 || 3.0.0-beta.1'
